<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルービックキューブ - 完全自由回転</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 50%, #0f1a2e 100%);
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    }
    
    canvas { 
      display: block; 
      cursor: grab;
    }
    
    canvas:active { 
      cursor: grabbing; 
    }
    
    #ui {
      position: fixed;
      left: 15px;
      top: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    #help {
      padding: 18px 22px;
      background: rgba(10, 10, 20, 0.85);
      color: #e0e0e0;
      font-size: 13px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(79, 172, 254, 0.2);
      line-height: 1.9;
      max-width: 280px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    #help h3 {
      margin: 0 0 14px 0;
      color: #4facfe;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .key {
      display: inline-block;
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.1));
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid rgba(79, 172, 254, 0.3);
      color: #4facfe;
    }
    
    .highlight {
      color: #00f2fe;
      font-weight: 600;
    }
    
    .section {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    
    .section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    
    .btn:active {
      transform: translateY(-1px);
    }
    
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .btn-shuffle { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-reset { 
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }
    
    #stats {
      position: fixed;
      right: 15px;
      top: 15px;
      padding: 20px 30px;
      background: rgba(10, 10, 20, 0.85);
      color: #fff;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(79, 172, 254, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    #stats .label {
      font-size: 11px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }
    
    #stats .value {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
    }
    
    #preview-info {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 0;
      background: rgba(10, 15, 30, 0.95);
      color: #fff;
      border-radius: 20px;
      font-size: 16px;
      text-align: center;
      backdrop-filter: blur(25px);
      border: 2px solid transparent;
      background-clip: padding-box;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), 
                  0 0 0 2px rgba(79, 172, 254, 0.5),
                  inset 0 1px 0 rgba(255,255,255,0.1);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      min-width: 340px;
      overflow: hidden;
    }
    
    #preview-info.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    #preview-info .header {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.3), rgba(0, 242, 254, 0.2));
      padding: 12px 25px;
      border-bottom: 1px solid rgba(79, 172, 254, 0.3);
    }
    
    #preview-info .title {
      color: #4facfe;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    #preview-info .content {
      padding: 20px 25px;
    }
    
    #preview-info .action {
      font-size: 24px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    
    #preview-info .face-name {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 32px;
      font-weight: bold;
    }
    
    #preview-info .direction {
      font-size: 18px;
      color: #aaa;
    }
    
    #preview-info .direction-icon {
      font-size: 28px;
      animation: pulse 1s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    
    #preview-info .footer {
      padding: 12px 25px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    #preview-info .hint {
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    
    #preview-info .hint-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    #preview-info .hint-icon {
      font-size: 14px;
    }
    
    #message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 16px 35px;
      background: rgba(10, 10, 20, 0.9);
      color: #4facfe;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      border: 1px solid rgba(79, 172, 254, 0.3);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    
    #message.show { 
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    #message.success {
      color: #00f2a0;
      border-color: rgba(0, 242, 160, 0.3);
    }

    #axis-indicator {
      position: fixed;
      left: 15px;
      bottom: 15px;
      width: 100px;
      height: 100px;
      background: rgba(10, 10, 20, 0.8);
      border-radius: 14px;
      border: 1px solid rgba(79, 172, 254, 0.2);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    #mode-indicator {
      position: fixed;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      padding: 14px 22px;
      background: rgba(10, 10, 20, 0.85);
      border-radius: 14px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    #mode-indicator.preview {
      background: rgba(79, 172, 254, 0.15);
      border-color: #4facfe;
      color: #4facfe;
      box-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
    }
    
    #mode-indicator.camera {
      background: rgba(255, 165, 0, 0.15);
      border-color: #ffa500;
      color: #ffa500;
      box-shadow: 0 0 30px rgba(255, 165, 0, 0.3);
    }

    #camera-info {
      position: fixed;
      right: 15px;
      bottom: 15px;
      padding: 14px 20px;
      background: rgba(10, 10, 20, 0.85);
      border-radius: 14px;
      color: #777;
      font-size: 11px;
      font-family: 'Monaco', 'Consolas', monospace;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(79, 172, 254, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    #camera-info .title {
      color: #4facfe;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 12px;
    }
    
    /* 完成時のお祝い演出 */
    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s ease-out forwards;
    }
    
    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translateY(-100vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }
    
    /* プログレスリング */
    .progress-ring {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    .progress-ring.show {
      opacity: 1;
    }
    
    .progress-ring circle {
      fill: none;
      stroke-width: 4;
    }
    
    .progress-ring .bg {
      stroke: rgba(255,255,255,0.1);
    }
    
    .progress-ring .progress {
      stroke: #4facfe;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      transition: stroke-dashoffset 0.1s;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="help">
    <h3>🎮 操作ガイド</h3>
    
    <div class="section">
      <span class="highlight">🎯 キューブ回転</span><br>
      キューブ上で左ドラッグ
    </div>
    
    <div class="section">
      <span class="highlight">📷 カメラ（360°自由回転）</span><br>
      背景ドラッグ / 右ドラッグ
    </div>
    
    <div class="section">
      <span class="key">右クリック</span> キャンセル<br>
      <span class="key">ホイール</span> ズーム<br>
      <span class="key">R L U D F B</span> 各面を回転<br>
      <span class="key">C</span> カメラリセット
    </div>
  </div>
  <div class="btn-group">
    <button class="btn btn-shuffle" id="shuffleBtn">🔀 シャッフル</button>
    <button class="btn btn-reset" id="resetBtn">↺ リセット</button>
  </div>
</div>

<div id="stats">
  <div class="label">手数</div>
  <div class="value" id="moveCount">0</div>
</div>

<div id="mode-indicator">⏸️ 待機中</div>

<div id="preview-info">
  <div class="header">
    <div class="title">
      <span>🔍</span>
      <span>プレビューモード</span>
    </div>
  </div>
  <div class="content">
    <div class="action" id="previewAction">
      <span class="face-name">-</span>
      <span class="direction-icon">-</span>
      <span class="direction">-</span>
    </div>
  </div>
  <div class="footer">
    <div class="hint">
      <span class="hint-item">
        <span class="hint-icon">🖱️</span>
        <span>離す → 確定</span>
      </span>
      <span class="hint-item">
        <span class="hint-icon">🖱️</span>
        <span>右クリック → キャンセル</span>
      </span>
    </div>
  </div>
</div>

<svg class="progress-ring" id="progressRing" viewBox="0 0 60 60">
  <circle class="bg" cx="30" cy="30" r="26"/>
  <circle class="progress" id="progressCircle" cx="30" cy="30" r="26" 
          stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
</svg>

<div id="axis-indicator"></div>
<div id="message"></div>

<div id="camera-info">
  <div class="title">📷 カメラ (360°自由)</div>
  <div id="cameraData">-</div>
</div>

<div class="celebration" id="celebration"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ========================================
   Three.js セットアップ
======================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ライティング強化
const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
mainLight.position.set(10, 15, 10);
mainLight.castShadow = true;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
fillLight.position.set(-10, -5, -10);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
rimLight.position.set(0, -10, 5);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// 環境マップ用のグラデーション背景
const bgGeometry = new THREE.SphereGeometry(100, 32, 32);
const bgMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    color1: { value: new THREE.Color(0x0a0a12) },
    color2: { value: new THREE.Color(0x1a1a3e) }
  },
  vertexShader: `
    varying vec3 vPosition;
    void main() {
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 color1;
    uniform vec3 color2;
    varying vec3 vPosition;
    void main() {
      float t = (vPosition.y + 100.0) / 200.0;
      gl_FragColor = vec4(mix(color1, color2, t), 1.0);
    }
  `
});
const bgSphere = new THREE.Mesh(bgGeometry, bgMaterial);
scene.add(bgSphere);

/* ========================================
   トラックボールカメラ - 完全自由回転
======================================== */
const TrackballCamera = {
  distance: 12,
  minDistance: 5,
  maxDistance: 30,
  
  target: new THREE.Vector3(0, 0, 0),
  rotation: new THREE.Quaternion(),
  rotateSpeed: 1.5,
  screen: { width: 0, height: 0, left: 0, top: 0 },
  
  init() {
    const euler = new THREE.Euler(-Math.PI / 6, Math.PI / 4, 0, 'YXZ');
    this.rotation.setFromEuler(euler);
    this.distance = 12;
    this.updateScreenSize();
    this.update();
  },
  
  updateScreenSize() {
    const rect = renderer.domElement.getBoundingClientRect();
    this.screen.left = rect.left;
    this.screen.top = rect.top;
    this.screen.width = rect.width;
    this.screen.height = rect.height;
  },
  
  getMouseOnBall(clientX, clientY) {
    const mouseOnBall = new THREE.Vector3(
      (clientX - this.screen.width * 0.5 - this.screen.left) / (this.screen.width * 0.5),
      (this.screen.height * 0.5 + this.screen.top - clientY) / (this.screen.height * 0.5),
      0.0
    );
    
    const length = mouseOnBall.length();
    
    if (length > 1.0) {
      mouseOnBall.normalize();
    } else {
      mouseOnBall.z = Math.sqrt(1.0 - length * length);
    }
    
    return mouseOnBall;
  },
  
  rotateCamera(prevX, prevY, currX, currY) {
    const prev = this.getMouseOnBall(prevX, prevY);
    const curr = this.getMouseOnBall(currX, currY);
    
    const axis = new THREE.Vector3().crossVectors(curr, prev).normalize();
    const angle = Math.acos(Math.min(1.0, prev.dot(curr))) * this.rotateSpeed;
    
    if (axis.length() < 0.001 || isNaN(angle) || angle < 0.001) {
      return;
    }
    
    const quaternion = new THREE.Quaternion().setFromAxisAngle(axis, angle);
    this.rotation.multiply(quaternion);
    this.rotation.normalize();
    
    this.update();
  },
  
  update() {
    const position = new THREE.Vector3(0, 0, this.distance);
    position.applyQuaternion(this.rotation);
    position.add(this.target);
    
    camera.position.copy(position);
    
    const up = new THREE.Vector3(0, 1, 0);
    up.applyQuaternion(this.rotation);
    camera.up.copy(up);
    
    camera.lookAt(this.target);
    
    this.updateInfo();
  },
  
  zoom(delta) {
    this.distance *= 1 + delta * 0.001;
    this.distance = Math.max(this.minDistance, Math.min(this.maxDistance, this.distance));
    this.update();
  },
  
  updateInfo() {
    const euler = new THREE.Euler().setFromQuaternion(this.rotation, 'YXZ');
    const yaw = Math.round(THREE.MathUtils.radToDeg(euler.y));
    const pitch = Math.round(THREE.MathUtils.radToDeg(euler.x));
    const roll = Math.round(THREE.MathUtils.radToDeg(euler.z));
    
    document.getElementById('cameraData').innerHTML = 
      `Y: ${yaw}° P: ${pitch}° R: ${roll}°<br>距離: ${this.distance.toFixed(1)}`;
  },
  
  reset() {
    this.init();
  }
};

TrackballCamera.init();

/* ========================================
   ルービックキューブ
======================================== */
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

const COLORS = {
  R: 0xff3333,
  L: 0xff8c00,
  U: 0xffffff,
  D: 0xffee00,
  F: 0x00cc44,
  B: 0x3366ff,
  I: 0x1a1a1a
};

const FACE_NAMES = {
  'x': { '1': 'R', '-1': 'L', '0': 'M' },
  'y': { '1': 'U', '-1': 'D', '0': 'E' },
  'z': { '1': 'F', '-1': 'B', '0': 'S' }
};

const FACE_LABELS = {
  'R': '右面', 'L': '左面', 'U': '上面', 'D': '下面', 'F': '前面', 'B': '後面',
  'M': '中央', 'E': '中段', 'S': '中層'
};

let cubies = [];
let moveCount = 0;
let isRotating = false;

let previewGroup = null;
let previewArrow = null;
let currentPreview = null;
let dragHoldTime = 0;
let dragHoldStart = 0;

function createCubie(x, y, z) {
  const geometry = new THREE.BoxGeometry(0.92, 0.92, 0.92);
  
  const materials = [
    new THREE.MeshStandardMaterial({ 
      color: x === 1 ? COLORS.R : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    }),
    new THREE.MeshStandardMaterial({ 
      color: x === -1 ? COLORS.L : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    }),
    new THREE.MeshStandardMaterial({ 
      color: y === 1 ? COLORS.U : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    }),
    new THREE.MeshStandardMaterial({ 
      color: y === -1 ? COLORS.D : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    }),
    new THREE.MeshStandardMaterial({ 
      color: z === 1 ? COLORS.F : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    }),
    new THREE.MeshStandardMaterial({ 
      color: z === -1 ? COLORS.B : COLORS.I, 
      roughness: 0.25,
      metalness: 0.1
    })
  ];

  const mesh = new THREE.Mesh(geometry, materials);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // エッジを丸くするためのベベル効果
  const roundedGeom = new THREE.BoxGeometry(0.95, 0.95, 0.95);
  const edges = new THREE.EdgesGeometry(roundedGeom);
  const edgesMesh = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
    color: 0x000000,
    linewidth: 2
  }));
  mesh.add(edgesMesh);

  cubeGroup.add(mesh);
  cubies.push(mesh);
}

function initCube() {
  cubies.forEach(c => cubeGroup.remove(c));
  cubies = [];
  
  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        createCubie(x, y, z);
      }
    }
  }
  
  moveCount = 0;
  updateMoveCount();
}

function updateMoveCount() {
  document.getElementById('moveCount').textContent = moveCount;
}

function showMessage(text, duration = 1500, type = 'normal') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'show';
  if (type === 'success') msg.classList.add('success');
  setTimeout(() => msg.className = '', duration);
}

function setMode(mode) {
  const indicator = document.getElementById('mode-indicator');
  const previewInfo = document.getElementById('preview-info');
  
  indicator.className = '';
  previewInfo.classList.remove('show');
  
  if (mode === 'preview') {
    indicator.textContent = '🔍 プレビュー中';
    indicator.className = 'preview';
    previewInfo.classList.add('show');
  } else if (mode === 'camera') {
    indicator.textContent = '📷 カメラ回転中';
    indicator.className = 'camera';
  } else {
    indicator.textContent = '⏸️ 待機中';
  }
}

initCube();

/* ========================================
   座標スナップ
======================================== */
function snap(v) { return Math.round(v); }

function snapPosition(pos) {
  pos.x = snap(pos.x);
  pos.y = snap(pos.y);
  pos.z = snap(pos.z);
  return pos;
}

function snapQuaternion(q) {
  const euler = new THREE.Euler().setFromQuaternion(q, 'XYZ');
  const snapAngle = (v) => Math.round(v / (Math.PI / 2)) * (Math.PI / 2);
  euler.x = snapAngle(euler.x);
  euler.y = snapAngle(euler.y);
  euler.z = snapAngle(euler.z);
  q.setFromEuler(euler);
  return q;
}

/* ========================================
   回転方向の計算
======================================== */
function calculateRotation(dragStartInfo, dx, dy) {
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 20) return null;

  const faceNormal = dragStartInfo.worldNormal.clone();
  
  const absX = Math.abs(faceNormal.x);
  const absY = Math.abs(faceNormal.y);
  const absZ = Math.abs(faceNormal.z);
  
  let clickedAxis;
  if (absX > absY && absX > absZ) {
    clickedAxis = 'x';
  } else if (absY > absX && absY > absZ) {
    clickedAxis = 'y';
  } else {
    clickedAxis = 'z';
  }
  
  const rotationAxes = {
    'x': ['y', 'z'],
    'y': ['x', 'z'],
    'z': ['x', 'y']
  };
  
  const [axis1, axis2] = rotationAxes[clickedAxis];
  
  const screenDrag = new THREE.Vector2(dx, -dy).normalize();
  
  const getScreenDirection = (axis) => {
    const worldAxis = new THREE.Vector3();
    worldAxis[axis] = 1;
    
    const origin = new THREE.Vector3(0, 0, 0).project(camera);
    const end = worldAxis.clone().project(camera);
    
    const dir = new THREE.Vector2(end.x - origin.x, end.y - origin.y);
    if (dir.length() > 0.001) dir.normalize();
    return dir;
  };
  
  const screenDir1 = getScreenDirection(axis1);
  const screenDir2 = getScreenDirection(axis2);
  
  const dot1 = Math.abs(screenDrag.dot(screenDir1));
  const dot2 = Math.abs(screenDrag.dot(screenDir2));
  
  let rotationAxis = dot1 > dot2 ? axis2 : axis1;
  
  const pos = dragStartInfo.cubie.position.clone();
  snapPosition(pos);
  const layer = pos[rotationAxis];
  
  const cameraRight = new THREE.Vector3();
  const cameraUp = new THREE.Vector3();
  camera.matrixWorld.extractBasis(cameraRight, cameraUp, new THREE.Vector3());
  
  const dragWorld = new THREE.Vector3();
  dragWorld.addScaledVector(cameraRight, dx / len);
  dragWorld.addScaledVector(cameraUp, -dy / len);
  dragWorld.normalize();
  
  const crossProduct = new THREE.Vector3();
  crossProduct.crossVectors(faceNormal, dragWorld);
  
  const direction = crossProduct[rotationAxis] > 0 ? 1 : -1;
  
  return { axis: rotationAxis, layer, direction };
}

/* ========================================
   矢印を作成（改良版）
======================================== */
function createArrow(axis, layer, direction) {
  const group = new THREE.Group();
  
  // メインの弧
  const curve = new THREE.EllipseCurve(0, 0, 2.2, 2.2, 0, Math.PI * 1.5, direction > 0, 0);
  const points = curve.getPoints(60);
  
  // グラデーション効果のための複数ライン
  const colors = [0x00ff88, 0x00ffaa, 0x00ffcc];
  colors.forEach((color, i) => {
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ 
      color: color, 
      linewidth: 3 - i,
      transparent: true,
      opacity: 1 - i * 0.2
    });
    const arc = new THREE.Line(geometry, material);
    arc.position.z = -0.01 * i;
    group.add(arc);
  });
  
  // 矢印の先端
  const arrowHeadGeom = new THREE.ConeGeometry(0.3, 0.7, 12);
  const arrowHeadMat = new THREE.MeshBasicMaterial({ 
    color: 0x00ff88,
    transparent: true,
    opacity: 0.9
  });
  const arrowHead = new THREE.Mesh(arrowHeadGeom, arrowHeadMat);
  
  const lastPoint = points[points.length - 1];
  const secondLastPoint = points[points.length - 2];
  const tangent = new THREE.Vector2().subVectors(lastPoint, secondLastPoint).normalize();
  
  arrowHead.position.set(lastPoint.x, lastPoint.y, 0);
  arrowHead.rotation.z = Math.atan2(tangent.y, tangent.x) - Math.PI / 2;
  
  group.add(arrowHead);
  
  // グロー効果
  const glowGeom = new THREE.TorusGeometry(2.2, 0.15, 8, 60, Math.PI * 1.5);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00ff88,
    transparent: true,
    opacity: 0.2
  });
  const glow = new THREE.Mesh(glowGeom, glowMat);
  if (direction < 0) glow.rotation.z = Math.PI;
  group.add(glow);
  
  if (axis === 'x') {
    group.rotation.y = Math.PI / 2;
    group.position.set(layer, 0, 0);
  } else if (axis === 'y') {
    group.rotation.x = -Math.PI / 2;
    group.position.set(0, layer, 0);
  } else {
    group.position.set(0, 0, layer);
  }
  
  return group;
}

/* ========================================
   プレビューモード（改良版）
======================================== */
function startPreview(axis, layer, direction) {
  if (currentPreview && 
      currentPreview.axis === axis && 
      currentPreview.layer === layer && 
      currentPreview.direction === direction) {
    return;
  }
  
  cancelPreview();
  currentPreview = { axis, layer, direction };
  dragHoldStart = Date.now();
  
  const targets = cubies.filter(cubie => {
    const pos = cubie.position.clone();
    snapPosition(pos);
    return Math.abs(pos[axis] - layer) < 0.1;
  });

  if (targets.length === 0) {
    currentPreview = null;
    return;
  }

  previewGroup = new THREE.Group();
  scene.add(previewGroup);

  targets.forEach(cubie => {
    cubie.material.forEach((mat) => {
      mat.transparent = true;
      mat.opacity = 0.2;
    });
    
    const clone = cubie.clone();
    clone.material = cubie.material.map((mat) => {
      const newMat = mat.clone();
      newMat.transparent = true;
      newMat.opacity = 1.0;
      newMat.emissive = new THREE.Color(0x333333);
      return newMat;
    });
    
    clone.position.copy(cubie.position);
    clone.quaternion.copy(cubie.quaternion);
    previewGroup.add(clone);
    clone.userData.original = cubie;
  });

  const previewAngle = (Math.PI / 4.5) * direction;
  previewGroup.rotation[axis] = previewAngle;

  previewArrow = createArrow(axis, layer, direction);
  scene.add(previewArrow);

  // プレビュー情報を更新
  const faceCode = FACE_NAMES[axis][String(layer)] || `${axis.toUpperCase()}`;
  const faceLabel = FACE_LABELS[faceCode] || faceCode;
  const dirIcon = direction > 0 ? '↻' : '↺';
  const dirText = direction > 0 ? '時計回り' : '反時計回り';
  
  document.getElementById('previewAction').innerHTML = `
    <span class="face-name">${faceCode}</span>
    <span class="direction-icon">${dirIcon}</span>
    <span class="direction">${dirText}</span>
  `;
  
  setMode('preview');
}

function cancelPreview() {
  if (previewGroup) {
    scene.remove(previewGroup);
    scene.remove(previewArrow);

    previewGroup.children.forEach(clone => {
      const originalCubie = clone.userData.original;
      if (originalCubie) {
        originalCubie.material.forEach((mat) => {
          mat.transparent = false;
          mat.opacity = 1.0;
          mat.emissive = new THREE.Color(0x000000);
        });
      }
    });

    previewGroup = null;
    previewArrow = null;
  }
  
  currentPreview = null;
  dragHoldStart = 0;
  
  // プログレスリングを非表示
  document.getElementById('progressRing').classList.remove('show');
  
  setMode('idle'); 
}

/* ========================================
   回転実行ロジック
======================================== */
function rotateFace(axis, layer, direction, animate = true) {
  return new Promise(resolve => {
    if (isRotating && animate) {
      resolve();
      return;
    }
    isRotating = true;

    const targets = cubies.filter(cubie => {
      const pos = cubie.position.clone();
      snapPosition(pos);
      return Math.abs(pos[axis] - layer) < 0.1;
    });

    if (targets.length === 0) {
      isRotating = false;
      resolve();
      return;
    }

    const rotationGroup = new THREE.Group();
    cubeGroup.add(rotationGroup);

    targets.forEach(cubie => {
      cubeGroup.remove(cubie);
      rotationGroup.add(cubie);
    });

    const targetAngle = direction * Math.PI / 2;
    const duration = animate ? 200 : 0;
    const startTime = Date.now();

    function updateRotation() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      // よりスムーズなイージング
      const eased = 1 - Math.pow(1 - progress, 4);
      rotationGroup.rotation[axis] = targetAngle * eased;

      if (progress < 1 && animate) {
        requestAnimationFrame(updateRotation);
      } else {
        finishRotation();
      }
    }

    function finishRotation() {
      rotationGroup.rotation[axis] = targetAngle;

      targets.forEach(cubie => {
        const worldPos = new THREE.Vector3();
        cubie.getWorldPosition(worldPos);
        const worldQuat = new THREE.Quaternion();
        cubie.getWorldQuaternion(worldQuat);

        cubie.position.copy(snapPosition(worldPos));
        cubie.quaternion.copy(snapQuaternion(worldQuat));

        rotationGroup.remove(cubie);
        cubeGroup.add(cubie);
      });

      cubeGroup.remove(rotationGroup);
      isRotating = false;
      
      if (animate) {
        moveCount++;
        updateMoveCount();
        
        // 完成チェック
        if (checkSolved()) {
          celebrate();
        }
      }
      resolve();
    }

    if (animate) {
      updateRotation();
    } else {
      finishRotation();
    }
  });
}

/* ========================================
   完成チェック
======================================== */
function checkSolved() {
  // 各キュービーが元の位置にあるかチェック
  for (const cubie of cubies) {
    const pos = cubie.position.clone();
    snapPosition(pos);
    
    // 回転が初期状態かチェック
    const euler = new THREE.Euler().setFromQuaternion(cubie.quaternion);
    const isRotationReset = 
      Math.abs(euler.x % (Math.PI * 2)) < 0.1 &&
      Math.abs(euler.y % (Math.PI * 2)) < 0.1 &&
      Math.abs(euler.z % (Math.PI * 2)) < 0.1;
    
    if (!isRotationReset) return false;
  }
  return true;
}

function celebrate() {
  showMessage('🎉 完成おめでとう！ 🎉', 3000, 'success');
  
  // 紙吹雪エフェクト
  const celebration = document.getElementById('celebration');
  celebration.innerHTML = '';
  
  const colors = ['#ff3333', '#ff8c00', '#ffee00', '#00cc44', '#3366ff', '#ffffff'];
  
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 2 + 's';
    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
    celebration.appendChild(confetti);
  }
  
  setTimeout(() => {
    celebration.innerHTML = '';
  }, 5000);
}

/* ========================================
   イベント処理
======================================== */
let isMouseDown = false;
let isRightClick = false;
let dragStart = { x: 0, y: 0 };
let dragStartInfo = null;

const raycaster = new THREE.Raycaster();

function getMousePosition(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1
  );
}

function getHitCubie(mousePos) {
  raycaster.setFromCamera(mousePos, camera);
  const intersects = raycaster.intersectObjects(cubies);
  
  if (intersects.length > 0) {
    const intersect = intersects[0];
    const worldNormal = intersect.face.normal.clone().transformDirection(intersect.object.matrixWorld);
    return {
      cubie: intersect.object,
      point: intersect.point,
      worldNormal: worldNormal
    };
  }
  return null;
}

/* ========================================
   マウス/タッチイベント
======================================== */
renderer.domElement.addEventListener('mousedown', (event) => {
  if (isRotating) return;
  event.preventDefault();

  isMouseDown = true;
  isRightClick = event.button === 2;
  dragStart = { x: event.clientX, y: event.clientY };
  
  const hit = getHitCubie(getMousePosition(event));

  if (isRightClick || !hit) {
    setMode('camera');
    TrackballCamera.updateScreenSize();
    dragStartInfo = null;
    return;
  }
  
  dragStartInfo = hit;
  cancelPreview();
  setMode('idle'); 
});

renderer.domElement.addEventListener('mousemove', (event) => {
  if (!isMouseDown || isRotating) return;

  const dx = event.clientX - dragStart.x;
  const dy = event.clientY - dragStart.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  
  if (isRightClick || !dragStartInfo) {
    TrackballCamera.rotateCamera(dragStart.x, dragStart.y, event.clientX, event.clientY);
    dragStart = { x: event.clientX, y: event.clientY };
  } else if (len > 10) { 
    const rotation = calculateRotation(dragStartInfo, dx, dy);
    if (rotation) {
      startPreview(rotation.axis, rotation.layer, rotation.direction);
    }
  }
});

renderer.domElement.addEventListener('mouseup', async (event) => {
  if (!isMouseDown || isRotating) return;
  
  const dx = event.clientX - dragStart.x;
  const dy = event.clientY - dragStart.y;
  const len = Math.sqrt(dx * dx + dy * dy);

  isMouseDown = false;
  isRightClick = false;
  
  setMode('idle');

  if (len < 10) {
    cancelPreview();
    dragStartInfo = null;
    return;
  }

  if (currentPreview) {
    await rotateFace(currentPreview.axis, currentPreview.layer, currentPreview.direction);
    cancelPreview();
  }
  
  dragStartInfo = null;
});

renderer.domElement.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (currentPreview) {
        cancelPreview();
        setMode('idle');
        dragStartInfo = null;
        isMouseDown = false;
        isRightClick = false;
        showMessage('キャンセルしました', 1000);
    }
});

renderer.domElement.addEventListener('wheel', (event) => {
  TrackballCamera.zoom(event.deltaY * 0.1);
});

// ----------------------------------------
// キーボード入力
// ----------------------------------------
const KEY_MAP = {
    'R': { axis: 'x', layer: 1, direction: 1 },
    'L': { axis: 'x', layer: -1, direction: -1 },
    'U': { axis: 'y', layer: 1, direction: 1 },
    'D': { axis: 'y', layer: -1, direction: -1 },
    'F': { axis: 'z', layer: 1, direction: 1 },
    'B': { axis: 'z', layer: -1, direction: -1 },
    ' ': 'SHUFFLE',
    'X': 'RESET',
};

document.addEventListener('keydown', async (event) => {
    if (isRotating) return;
    const key = event.key.toUpperCase();
    
    if (KEY_MAP[key]) {
        event.preventDefault();
        
        const action = KEY_MAP[key];

        if (typeof action === 'string') {
          if (action === 'SHUFFLE') {
            await shuffleCube();
          } else if (action === 'RESET') {
            resetCube();
          }
          return;
        }

        const { axis, layer, direction } = action;
        const faceCode = FACE_NAMES[axis][String(layer)];
        showMessage(`${faceCode}面を回転...`, 800);
        await rotateFace(axis, layer, direction, true);
    }
    
    if (key === 'C') {
        TrackballCamera.reset();
        showMessage('カメラをリセット', 1000);
    }
});

// ----------------------------------------
// シャッフル/リセット関数
// ----------------------------------------
async function shuffleCube() {
    showMessage('シャッフル中...', 1500);
    
    document.getElementById('shuffleBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;

    const AXES = ['x', 'y', 'z'];
    const LAYERS = [-1, 0, 1];
    const DIRECTIONS = [-1, 1];

    for (let i = 0; i < 25; i++) {
        const axis = AXES[Math.floor(Math.random() * AXES.length)];
        const layer = LAYERS[Math.floor(Math.random() * LAYERS.length)];
        const direction = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
        await rotateFace(axis, layer, direction, false);
    }

    moveCount = 0;
    updateMoveCount();
    showMessage('シャッフル完了！挑戦開始！', 1500, 'success');
    document.getElementById('shuffleBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
}

function resetCube() {
    if (isRotating) return;
    initCube();
    TrackballCamera.reset();
    showMessage('リセットしました', 1500);
}

document.getElementById('shuffleBtn').addEventListener('click', shuffleCube);
document.getElementById('resetBtn').addEventListener('click', resetCube);

// ウィンドウリサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  TrackballCamera.updateScreenSize();
});

// ----------------------------------------
// アニメーションループ
// ----------------------------------------
let lastTime = 0;

function animate(time) {
  requestAnimationFrame(animate);
  
  const delta = time - lastTime;
  lastTime = time;
  
  // プレビュー中のアニメーション
  if (currentPreview && previewArrow) {
    const { axis, direction } = currentPreview;
    const t = time * 0.002;
    
    // プレビューグループの回転アニメーション
    const baseAngle = (Math.PI / 4.5) * direction;
    const oscillation = Math.sin(t * 2) * 0.03 * direction;
    previewGroup.rotation[axis] = baseAngle + oscillation;
    
    // 矢印のパルスアニメーション
    const scale = 1 + Math.sin(t * 3) * 0.05;
    previewArrow.scale.setScalar(scale);
    
    // 矢印の透明度アニメーション
    previewArrow.traverse(child => {
      if (child.material) {
        child.material.opacity = 0.6 + Math.sin(t * 4) * 0.3;
      }
    });
  }
  
  renderer.render(scene, camera);
}

animate(0);
</script>
